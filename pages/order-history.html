<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Critical initialization: BASE_PATH, cart preload, variant detection -->
  <script src="../scripts/critical-init.js"></script>
  <title>Order History - BuildRight Solutions</title>
  <script src="../scripts/scripts.js" type="module"></script>
  <link rel="stylesheet" href="../styles/styles.css">
  <!-- Order Dropin styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@dropins/storefront-order@latest/dist/index.css">
</head>
<body class="page-order-history">
  <!-- Header loaded dynamically from blocks/header/ -->
  <header></header>

  <!-- Main Content -->
  <main>
    <!-- Breadcrumbs -->
    <div class="breadcrumbs">
      <div>
        <div><a href="../index.html">Home</a></div>
      </div>
      <div>
        <div>Order History</div>
      </div>
    </div>

    <section class="section order-history-section">
      <div class="container order-history-container">
        <div class="page-header">
          <h1 class="page-title">Order History</h1>
          <p class="page-subtitle">View and manage your past orders</p>
        </div>
        
        <!-- Commerce Order History Dropin -->
        <div id="order-history-dropin" class="order-history-dropin-container"></div>
      </div>
    </section>
  </main>

  <!-- Footer loaded dynamically from blocks/footer/ -->
  <footer></footer>

  <script type="module">
    import { loadConfig } from '../scripts/site-config.js';
    import { waitForDropins } from '../scripts/initializers/index.js';
    
    async function initializeOrderHistoryPage() {
      const config = await loadConfig();
      const container = document.getElementById('order-history-dropin');
      
      if (!config.features?.useCommerceDropins) {
        container.innerHTML = `
          <div class="orders-disabled">
            <p>Commerce Dropins are not enabled.</p>
            <a href="catalog.html" class="btn btn-primary">Browse Catalog</a>
          </div>
        `;
        return;
      }
      
      // Wait for Commerce Dropins to initialize
      await waitForDropins();
      
      try {
        // Import and render OrderList container
        const { render } = await import('@dropins/storefront-order/render.js');
        const OrderList = (await import('@dropins/storefront-order/containers/OrderList.js')).default;
        
        // Define routes
        const basePath = window.BASE_PATH || '/';
        
        await render(OrderList, {
          routeOrderDetails: (order) => `${basePath}pages/order-details.html?order=${order.number}`,
          routeProductPage: (product) => `${basePath}pages/product-detail.html?sku=${product.sku}`,
          routeReturnUrl: (order) => `${basePath}pages/returns.html?order=${order.number}`,
          // Pagination
          pageSize: 10,
        })(container);
        
        console.log('[Order History] Commerce Order Dropin rendered');
        
      } catch (error) {
        console.error('[Order History] Failed to render Order Dropin:', error);
        container.innerHTML = `
          <div class="orders-error">
            <div class="empty-state">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
              </svg>
              <h3>Unable to Load Orders</h3>
              <p>Please try again later or contact support.</p>
              <a href="catalog.html" class="btn btn-primary">Continue Shopping</a>
            </div>
          </div>
        `;
      }
    }
    
    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeOrderHistoryPage);
    } else {
      initializeOrderHistoryPage();
    }
  </script>
  
  <style>
    .order-history-section {
      padding: 2rem 0 4rem;
    }
    
    .order-history-container {
      max-width: var(--container-max-width);
      margin: 0 auto;
      padding: 0 var(--section-padding-horizontal);
    }
    
    .page-header {
      margin-bottom: 2rem;
    }
    
    .page-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-text);
      margin: 0 0 0.5rem;
    }
    
    .page-subtitle {
      color: var(--color-text-secondary);
      margin: 0;
    }
    
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--color-surface);
      border-radius: var(--shape-border-radius-3);
      border: 2px dashed var(--color-border);
    }
    
    .empty-state svg {
      margin-bottom: 1rem;
      opacity: 0.5;
    }
    
    .empty-state h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 0.5rem;
    }
    
    .empty-state p {
      color: var(--color-text-secondary);
      margin-bottom: 1.5rem;
    }
    
    .orders-disabled,
    .orders-error {
      padding: 2rem 0;
    }
  </style>
</body>
</html>
