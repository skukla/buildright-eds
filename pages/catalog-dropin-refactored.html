<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Critical initialization: BASE_PATH, cart preload, variant detection -->
  <script src="../scripts/critical-init.js"></script>
  <title>Catalog Dropin - REFACTORED (Zero !important) - BuildRight Solutions</title>
  
  <!-- Commerce Dropins Import Maps -->
  <script type="importmap">
  {
    "imports": {
      "@dropins/tools/": "/node_modules/@dropins/tools/",
      "@dropins/storefront-auth/": "/node_modules/@dropins/storefront-auth/",
      "@dropins/storefront-cart/": "/node_modules/@dropins/storefront-cart/",
      "@dropins/storefront-checkout/": "/node_modules/@dropins/storefront-checkout/",
      "@dropins/storefront-account/": "https://cdn.jsdelivr.net/npm/@dropins/storefront-account@latest/",
      "@dropins/storefront-order/": "/node_modules/@dropins/storefront-order/",
      "@dropins/storefront-product-discovery/": "/node_modules/@dropins/storefront-product-discovery/"
    }
  }
  </script>
  
  <script src="../scripts/scripts.js" type="module"></script>
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="stylesheet" href="../blocks/product-filter/project-filter.css">
  <!-- REFACTORED CSS - Zero !important declarations -->
  <link rel="stylesheet" href="../blocks/product-list-dropin-v2/product-list-dropin-v2-refactored.css">
  
  <style>
    /* Test page banner */
    .refactored-banner {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      border-bottom: 3px solid #047857;
    }
    
    .refactored-banner-title {
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
    }
    
    .refactored-banner-stats {
      font-size: 0.875rem;
      opacity: 0.9;
    }
  </style>
</head>
<body class="page-catalog page-catalog-dropin page-catalog-refactored">
  <!-- Test Banner -->
  <div class="refactored-banner">
    <div class="refactored-banner-title">
      ✅ REFACTORED VERSION - Proper Slot Namespacing
    </div>
    <div class="refactored-banner-stats">
      !important: 384 → 0 (100% reduction) | CSS Lines: 882 → 320 (64% reduction) | Clean, Maintainable Code
    </div>
  </div>

  <!-- Header loaded dynamically from blocks/header/ -->
  <header></header>

  <!-- Main Content -->
  <main>
    <!-- Breadcrumbs -->
    <div class="breadcrumbs">
      <div>
        <div><a href="../index.html">Home</a></div>
      </div>
      <div>
        <div id="breadcrumb-category">All Products (Refactored Dropin)</div>
      </div>
    </div>

    <section class="section section-compact">
      <div class="container">
        <h1 id="catalog-title">All Products (Refactored - Zero !important)</h1>
        
        <div class="catalog-layout" id="catalog-layout">
          <!-- Catalog Loading Overlay -->
          <div class="catalog-loading-overlay" id="catalog-loading">
            <div class="loading-spinner loading-spinner-sm"></div>
            <p style="margin-top: var(--spacing-medium); color: var(--color-text-secondary);">Loading catalog...</p>
          </div>
          
          <!-- Search and Sort Bar (spans full width) -->
          <div class="catalog-controls-wrapper" style="visibility: hidden;">
            <div class="catalog-controls">
              <div class="catalog-search">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input 
                  type="search" 
                  id="catalog-search-input" 
                  class="catalog-search-input" 
                  placeholder="Search products..."
                  aria-label="Search products"
                />
                <button class="search-clear" id="search-clear" aria-label="Clear search" style="display: none;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>
              
              <div class="dropin-sort-container">
                <!-- SortBy dropin will render here -->
              </div>
            </div>
          </div>
          
          <!-- Filters Sidebar -->
          <aside id="filters-aside" style="visibility: hidden;">
            <div class="dropin-facets-container">
              <!-- Facets dropin will render here -->
            </div>
          </aside>

          <!-- Product Grid (Dropin with REFACTORED Custom Slots) -->
          <div style="visibility: hidden;" id="product-grid-wrapper">
            <div class="product-list-dropin-v2-refactored" data-block-name="product-list-dropin-v2-refactored" data-block-status="loading">
              <div>
                <div>
                  <div class="grid-header">
                    <div class="grid-header-controls">
                      <button class="btn btn-secondary btn-sm" id="mobile-filter-toggle">Filters</button>
                    </div>
                    <div class="product-count">Loading products...</div>
                  </div>
                  
                  <div class="dropin-search-results-container">
                    <!-- SearchResults dropin with REFACTORED custom slots will render here -->
                  </div>
                  
                  <div class="dropin-pagination-container">
                    <!-- Pagination dropin will render here -->
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer loaded dynamically from blocks/footer/ -->
  <footer></footer>

  <script type="module">
    // Import the REFACTORED block decorator
    import decorateRefactored from '../blocks/product-list-dropin-v2/product-list-dropin-v2-refactored.js';
    
    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
    
    async function init() {
      console.log('[Refactored Test Page] Initializing...');
      
      // Get the block element
      const block = document.querySelector('[data-block-name="product-list-dropin-v2-refactored"]');
      
      if (block) {
        console.log('[Refactored Test Page] Decorating refactored block...');
        await decorateRefactored(block);
        console.log('[Refactored Test Page] Block decorated!');
      } else {
        console.error('[Refactored Test Page] Block element not found');
      }
    }
  </script>

  <script>
    // Handle catalog loading overlay
    (async function() {
      const overlay = document.getElementById('catalog-loading');
      const controlsWrapper = document.querySelector('.catalog-controls-wrapper');
      const filtersAside = document.getElementById('filters-aside');
      const productGridWrapper = document.getElementById('product-grid-wrapper');
      const productCount = document.querySelector('.product-count');
      
      // Listen for catalog loaded event (hide spinner, show content)
      window.addEventListener('catalogLoaded', () => {
        console.log('[Refactored Test Page] Catalog loaded event received');
        if (overlay) {
          overlay.classList.add('hidden');
        }
        if (controlsWrapper) {
          controlsWrapper.style.visibility = 'visible';
        }
        if (filtersAside) {
          filtersAside.style.visibility = 'visible';
        }
        if (productGridWrapper) {
          productGridWrapper.style.visibility = 'visible';
        }
      });
    })();
  </script>
</body>
</html>
