<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - BuildRight</title>
  
  <!-- Critical initialization: BASE_PATH, cart preload -->
  <script src="../scripts/critical-init.js"></script>
  
  <!-- Commerce Dropins Import Maps -->
  <script type="importmap">
  {
    "imports": {
      "@dropins/tools/": "https://cdn.jsdelivr.net/npm/@dropins/tools@latest/",
      "@dropins/storefront-auth/": "https://cdn.jsdelivr.net/npm/@dropins/storefront-auth@latest/",
      "@dropins/storefront-cart/": "https://cdn.jsdelivr.net/npm/@dropins/storefront-cart@latest/",
      "@dropins/storefront-checkout/": "https://cdn.jsdelivr.net/npm/@dropins/storefront-checkout@latest/",
      "@dropins/storefront-account/": "https://cdn.jsdelivr.net/npm/@dropins/storefront-account@latest/",
      "@dropins/storefront-order/": "https://cdn.jsdelivr.net/npm/@dropins/storefront-order@latest/"
    }
  }
  </script>
  
  <script type="module" src="../scripts/scripts.js"></script>
  <script type="module" src="../scripts/dashboard.js"></script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
  <!-- Header block (loaded by scripts.js) -->
  <header></header>
  
  <!-- Main content -->
  <main class="dashboard-container">
    <!-- Persona-specific content loaded by dashboard.js -->
    <div id="dashboard-content" class="dashboard-content">
    </div>
  </main>
  
  <!-- Footer block -->
  <footer></footer>
</body>
</html>
